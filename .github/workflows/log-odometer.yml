name: Log odometer

on:
  schedule:
    - cron: "17 5 * * *"   # every day at 05:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install py-uconnect
        run: pip install "py-uconnect>=1.0"

      - name: Read odometer from Alfa Connect
        env:
          UCONNECT_EMAIL: ${{ secrets.UCONNECT_EMAIL }}
          UCONNECT_PASSWORD: ${{ secrets.UCONNECT_PASSWORD }}
          UCONNECT_BRAND: ALFA_ROMEO_EU
        run: python scripts/log_odometer.py

      - name: Save the new reading
        run: |
          git config user.name "odometer-bot"
          git config user.email "odometer-bot@users.noreply.github.com"
          git add docs/readings.json
          if git diff --cached --quiet; then
            echo "No change to commit."
          else
            git commit -m "Odometer reading $(date -u +%F)"
            git push
          fi
